name: Feature request
description: Propose a focused improvement to the TypeScript SDK.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the developer problem without prescribing private control-plane changes.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed public behavior
      description: Include API sketches where helpful.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and compatibility impact
      description: Consider credentials, logs, errors, permissions, AgentGateway compatibility, and Python SDK parity.
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: This proposal can be implemented using public SDK contracts and does not require disclosure of control-plane internals.
          required: true
