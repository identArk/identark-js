name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets the job mint an OIDC token. npm exchanges that for short-lived
      # publish rights, and it signs the provenance attestation. Without it,
      # trusted publishing fails with a missing-token error.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'

      # The npm bundled with Node 22 predates OIDC trusted publishing, which
      # needs npm >= 11.5.1. Without this the publish step looks for a token
      # instead and fails with ENEEDAUTH.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test -- --run

      - name: Build
        run: npm run build

      # No NODE_AUTH_TOKEN, deliberately. Auth comes from the OIDC token above,
      # exchanged with npm because this repo + workflow are registered as a
      # Trusted Publisher for the `identark` package. Nothing secret is stored
      # in the repo, so there is no token to leak, rotate, or have restricted
      # by npm's 2FA-bypass changes. Provenance is attached automatically.
      - name: Publish to npm
        run: npm publish --access public
